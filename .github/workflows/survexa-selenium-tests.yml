name: Survexa Selenium 350 Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: Execute Selenium 350 Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Chrome Browser
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Install root dependencies
      working-directory: SurveyForge
      run: npm install

    - name: Install backend dependencies
      working-directory: SurveyForge/backend
      run: npm install

    - name: Start Backend
      working-directory: SurveyForge/backend
      run: |
        node server.js &
        sleep 5

    - name: Start Frontend
      working-directory: SurveyForge
      run: |
        npm run dev &
        npx wait-on http://localhost:5173 --timeout 30000 || sleep 10

    - name: Setup Selenium environment
      working-directory: SurveyForge/selenium
      run: npm install

    - name: Ensure test directories and reports exist
      run: |
        mkdir -p SurveyForge/selenium/reports/excel
        mkdir -p SurveyForge/reports/excel
        mkdir -p reports/excel

    - name: Run Selenium Test Suite & Generate Report
      working-directory: SurveyForge/selenium
      run: node run_and_report.js

    - name: Upload Excel Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Selenium_Test_Report
        path: |
          SurveyForge/reports/excel/Selenium_Test_Report.xlsx
          SurveyForge/Selenium_Test_Report.xlsx
          SurveyForge/selenium/reports/excel/Selenium_Test_Report.xlsx
          Selenium_Test_Report.xlsx
        retention-days: 30
